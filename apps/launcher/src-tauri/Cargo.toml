[package]
name = "novex-launcher"
version = "0.3.0"
description = "A clean, minimal Minecraft launcher"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "novex_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "2"
minisign-verify = "0.3.0"
semver = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
