name: Release

# Push a tag like v0.2.0 to build installers for every platform. Once they've all built, the
# release is published as "latest", which is where installed apps look for updates. The tag must
# match the version in tauri.conf.json, or installed apps wouldn't see anything newer.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows
            runner: windows-latest
            rust_targets: ""
            # NSIS only: it's what Novex installs and updates with, so an MSI would just be clutter.
            args: --bundles nsis
          - name: Windows ARM64
            os: windows
            runner: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            # WiX (MSI) can't target ARM64, so only the NSIS installer is built here.
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: Linux x64
            os: linux
            runner: ubuntu-22.04
            rust_targets: ""
            args: ""
          - name: Linux ARM64
            os: linux
            runner: ubuntu-22.04-arm
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./apps/launcher/src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json."
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/launcher
        run: npm ci

      # Signing is optional so forks and first releases still build. GitHub passes missing
      # secrets as empty strings, which Tauri would try to use, so only set ones exist.
      - name: Load signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$RANDOM$RANDOM"
              printf '%s<<%s\n%s\n%s\n' "$name" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            fi
          done
          # Update artifacts (.tar.gz/.zip + .sig, and latest.json) need the signing key.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
            # GitHub can't store an empty secret, so a key without a password has none.
            if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY isn't set, so this release can't update existing installs."
          fi


      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the app at build time. Empty secrets just disable the feature.
          NOVEX_MSA_CLIENT_ID: ${{ secrets.NOVEX_MSA_CLIENT_ID }}
          NOVEX_CURSEFORGE_API_KEY: ${{ secrets.NOVEX_CURSEFORGE_API_KEY }}
        with:
          projectPath: apps/launcher
          tagName: ${{ github.ref_name }}
          releaseName: Novex Launcher ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.UPDATER_ARGS }}
          # Windows updates use the per-user NSIS installer, matching how Novex installs.
          updaterJsonPreferNsis: true
          # Files sort by OS, e.g. Novex-Launcher_0.1.0_windows_x64-setup.exe.
          assetNamePattern: Novex-Launcher_[version]_${{ matrix.os }}_[arch][setup][ext]

  # Only after every platform built, so "latest" never points at a release missing one.
  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The download table goes above any notes written on GitHub. Updates read their signatures
      # from latest.json, so the .sig files are removed to leave a short list of downloads.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          sed -e "s|{version}|$version|g" -e "s|{download}|$download|g" .github/release-downloads.md > notes.md
          echo >> notes.md
          gh release view "$GITHUB_REF_NAME" --json body -q .body >> notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep '\.sig$' |
            xargs -r -n1 gh release delete-asset "$GITHUB_REF_NAME" -y
