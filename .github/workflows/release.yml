name: Release

# Push a tag like v0.1.0 to build installers for every platform into a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            runner: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            runner: windows-latest
            rust_targets: ""
            args: ""
          - name: Windows ARM64
            runner: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            # WiX (MSI) can't target ARM64, so only the NSIS installer is built here.
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: Linux x64
            runner: ubuntu-22.04
            rust_targets: ""
            args: ""
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/launcher
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing is wired up in M5. Uncomment once the secrets exist.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/launcher
          tagName: ${{ github.ref_name }}
          releaseName: Novex Launcher ${{ github.ref_name }}
          releaseBody: See the assets below to download the installer for your platform.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
